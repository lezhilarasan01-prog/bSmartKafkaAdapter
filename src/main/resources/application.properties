# Consumer Batch & Performance Configuration
kafka.consumer.max-poll-records=1000
kafka.consumer.batch-insert-size=100
kafka.consumer.fetch-max-wait-ms=200
kafka.consumer.offset-save-threshold=100
kafka.consumer.poll-timeout-ms=200
kafka.consumer.max-poll-interval-ms=600000
kafka.consumer.receive-buffer-bytes=65536
kafka.consumer.watchdog-stall-timeout-ms=180000
kafka.consumer.watchdog-check-interval-ms=15000
